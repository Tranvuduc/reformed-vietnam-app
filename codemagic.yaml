# Codemagic build config — Reformed Vietnam app (Capacitor wrapper)
# Build Android debug APK on Codemagic cloud. No signing keys needed for debug.
# Duc downloads the APK from the Codemagic dashboard and installs it directly.
workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2  # free plan: only the first 500 Mac mini M2 minutes/month are $0; ALL Linux/Windows instances cost $0.045/min and need billing enabled
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Sync Capacitor Android
        script: |
          npx cap sync android
      - name: Build debug APK
        script: |
          cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
